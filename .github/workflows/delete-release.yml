name: Release Deleted

on:
  release:
    types:
      - deleted

jobs:
  print-release-name:
    runs-on: ubuntu-latest

    steps:
      - name: Print deleted release name
        run: |
          echo "Deleted release name: ${{ github.event.release.name }}"
